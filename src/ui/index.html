<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Trial Eligibility Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 600px;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .header h1 {
            font-size: 20px;
            color: #111827;
        }
        .header p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 6px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
        }
        .message.agent {
            align-self: flex-start;
            background: #f3f4f6;
            color: #111827;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-area button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .input-area button:hover {
            background: #5568d3;
        }
        .input-area button:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Clinical Trial Eligibility Agent</h1>
            <p>Describe your situation, and we'll help find trials you might qualify for.</p>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input
                type="text"
                id="input"
                placeholder="Describe your medical situation..."
                autocomplete="off"
            />
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');

        let sessionId = null;

        // Load session ID from sessionStorage or generate new one on first message
        function getSessionId() {
            if (!sessionId) {
                const stored = sessionStorage.getItem('cte_session_id');
                sessionId = stored || null;
            }
            return sessionId;
        }

        async function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            // Add user message to UI
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = message;
            messagesDiv.appendChild(userMsgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            inputField.value = '';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: getSessionId(),
                        message: message
                    })
                });

                const data = await response.json();

                // Store or update session ID
                if (data.session_id) {
                    sessionId = data.session_id;
                    sessionStorage.setItem('cte_session_id', sessionId);
                }

                // Add agent response to UI
                const agentMsgDiv = document.createElement('div');
                agentMsgDiv.className = 'message agent';
                agentMsgDiv.textContent = data.response || 'No response';
                messagesDiv.appendChild(agentMsgDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

            } catch (error) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message agent';
                errorDiv.textContent = `Error: ${error.message}`;
                messagesDiv.appendChild(errorDiv);
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Focus on load
        inputField.focus();
    </script>
</body>
</html>
