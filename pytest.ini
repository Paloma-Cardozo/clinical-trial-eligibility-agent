[pytest]
# pytest configuration for CTE Agent tests

# Define custom markers
markers =
    llm: marks tests that call the Google Gemini API (excluded by default, run with -m llm)

# Default: exclude LLM tests (they require GOOGLE_API_KEY and cost money)
addopts = -m "not llm"

# Show extra test summary info
console_output_style = progress

testpaths = tests
